apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-project-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-project-app
  template:
    metadata:
      labels:
        app: k8s-project-app
    spec:
      containers:
      - name: app
        image: k8s-project-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"